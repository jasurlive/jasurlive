<svg xmlns="http://www.w3.org/2000/svg" width="754" height="44" viewBox="0 0 754 44">
<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.type{animation:slide 4.25s steps(85) .5s both}
.cursor{animation:slide 4.25s steps(85) .5s both,blink 1s step-end 4.75s infinite}
